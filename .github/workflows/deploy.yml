# Builds the site and uploads dist/ to Hostinger over FTPS on every push to master.
# Needs repository secrets FTP_USERNAME and FTP_PASSWORD (Settings > Secrets and variables > Actions).

name: Deploy to Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two uploads at the same time
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload over FTPS
        env:
          FTP_SERVER: ftp.papyblank.fr
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Hostinger's certificate is issued to *.hstgr.io, not ftp.papyblank.fr:
          # the chain is still verified (Let's Encrypt), only the host name check is skipped.
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          set net:max-retries 2
          set net:timeout 30
          # Hashed assets: compare by size only, remove files from older builds
          mirror --reverse --ignore-time --delete --parallel=4 --verbose dist/_astro/ /_astro/
          # Large, rarely changing files: upload only when the size changes
          mirror --reverse --ignore-time --parallel=2 --verbose dist/videos/ /videos/
          mirror --reverse --ignore-time --verbose dist/fonts/ /fonts/
          # Pages, .htaccess and icons: small, always uploaded. Nothing else on the server is deleted.
          mirror --reverse --exclude-glob _astro/ --exclude-glob videos/ --exclude-glob fonts/ --parallel=4 --verbose dist/ /
          bye
          EOF
